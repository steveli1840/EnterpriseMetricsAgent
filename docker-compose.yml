name: enterprise-metrics-agent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics -d metrics"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.6
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: admin-demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./data/clickhouse/users.xml:/etc/clickhouse-server/users.d/agent.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep Ok"]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "backend/scripts/migrate.py"]
    depends_on:
      postgres:
        condition: service_healthy

  dataset-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "backend/scripts/init_olist.py"]
    volumes:
      # Local Kaggle/Olist CSV files. The import script reads this folder first.
      - type: bind
        source: ./data/import
        target: /data/import
        read_only: true
      - type: bind
        source: ./data/clickhouse
        target: /app/data/clickhouse
        read_only: true
    depends_on:
      clickhouse:
        condition: service_healthy

  control-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["python", "backend/scripts/bootstrap_control_plane.py"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      dataset-init:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      dataset-init:
        condition: service_completed_successfully
      control-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  clickhouse-data:
