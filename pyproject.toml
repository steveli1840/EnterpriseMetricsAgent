[project]
name = "enterprise-metrics-agent"
version = "0.1.0"
description = "Governed enterprise data agent for trusted metric analysis"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "celery[redis]>=5.4,<6",
  "clickhouse-connect>=0.8,<1",
  "fastapi>=0.115,<1",
  "google-cloud-bigquery>=3.25,<4",
  "httpx>=0.27,<1",
  "kagglehub>=0.3.9,<1",
  "langgraph>=0.3,<2",
  "openai>=1.60,<3",
  "orjson>=3.10,<4",
  "passlib[bcrypt]>=1.7,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6,<7",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=26,<30",
  "sse-starlette>=2.2,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
